name: EPL Data Pipeline

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight
  workflow_dispatch:      # <--- ADD THIS LINE (It creates the "Run workflow" button)
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas lxml beautifulsoup4 html5lib boto3 python-dotenv

      -- name: Run Pipeline
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          python fetcher.py
          python cleaning.py
          python upload_to_s3.py

      - name: Upload Logs as Artifacts
        if: always() # Upload logs even if a previous step failed
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs/pipeline.log
